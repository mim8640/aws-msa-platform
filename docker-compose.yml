services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-plocal-root-only"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis-data:/data]
  member-service:
    build: { context: ., dockerfile: apps/member-service/Dockerfile }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/member_db?useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
    depends_on: { mysql: {condition: service_healthy}, redis: {condition: service_started} }
    ports: ["8081:8080"]
  product-service:
    build: { context: ., dockerfile: apps/product-service/Dockerfile }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true
      AWS_REGION: ap-northeast-2
      S3_BUCKET: local-placeholder-bucket
    depends_on: { mysql: {condition: service_healthy} }
    ports: ["8082:8080"]
  order-service:
    build: { context: ., dockerfile: apps/order-service/Dockerfile }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true
    depends_on: { mysql: {condition: service_healthy} }
    ports: ["8083:8080"]
  api-gateway:
    build: { context: ., dockerfile: apps/api-gateway/Dockerfile }
    environment:
      MEMBER_URL: http://member-service:8080
      PRODUCT_URL: http://product-service:8080
      ORDER_URL: http://order-service:8080
    depends_on: [member-service,product-service,order-service]
    ports: ["8080:8080"]
  frontend:
    build: ./apps/frontend
    depends_on: [api-gateway]
    ports: ["3000:8080"]
volumes:
  mysql-data:
  redis-data:
