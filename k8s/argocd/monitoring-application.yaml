apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mim8640/aws-msa-platform.git
    targetRevision: main
    path: k8s/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true