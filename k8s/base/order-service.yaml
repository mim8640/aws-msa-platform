apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: msa

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      serviceAccountName: order-service

      containers:
        - name: order-service
          image: 253041091860.dkr.ecr.ap-northeast-2.amazonaws.com/order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: app-secrets-eso

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: msa
  labels:
    monitoring: msa

spec:
  selector:
    app: order-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080

  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: msa
